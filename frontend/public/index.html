<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Aria — AI-Powered Loan Officer OS" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="cache-control" content="no-cache, no-store, must-revalidate, max-age=0, post-check=0, pre-check=0" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>Aria</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      code {
        font-family: source-code-pro, Menlo, Monaco, Consolas, 'Courier New', monospace;
      }
    </style>
    <!-- Google Maps/Places API for address autocomplete -->
    <!-- Replace GOOGLE_PLACES_API_KEY with your actual key in production -->
    <script>
      // Dynamically load Google Places API if key is available
      (function() {
        // Try to get key from environment or meta tag
        var apiKey = '';
        var metaKey = document.querySelector('meta[name="google-places-api-key"]');
        if (metaKey) {
          apiKey = metaKey.getAttribute('content');
        }
        // Check for window variable set by React app
        window.__GOOGLE_PLACES_CALLBACK__ = function() {
          console.log('Google Places API loaded');
          window.dispatchEvent(new Event('google-places-loaded'));
        };
        // Load script only if key is available
        if (apiKey && apiKey !== 'YOUR_API_KEY') {
          var script = document.createElement('script');
          script.src = 'https://maps.googleapis.com/maps/api/js?key=' + apiKey + '&libraries=places&callback=__GOOGLE_PLACES_CALLBACK__';
          script.async = true;
          script.defer = true;
          document.head.appendChild(script);
        } else {
          console.log('Google Places API key not configured - using manual address entry');
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      // Unregister all service workers and clear storage on load
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
            console.log('Service worker unregistered');
          }
        });
      }

      // Clear all caches
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) {
            caches.delete(name);
            console.log('Cache cleared:', name);
          }
        });
      }

      // Global error handler to prevent blank pages
      window.addEventListener('error', function(event) {
        console.error('Global error caught:', event.error);
        const root = document.getElementById('root');
        if (root && (!root.innerHTML || root.innerHTML.trim() === '')) {
          // Use innerHTML for structure only, then textContent for the error
          // message to prevent XSS from error strings
          root.innerHTML = '<div style="padding: 20px; font-family: Arial, sans-serif;"><h1>Application Error</h1><p>An error occurred while loading the application.</p><p id="error-detail" style="margin-top: 20px;"></p><button onclick="localStorage.clear(); window.location.reload();" style="margin-top: 20px; padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px;">Clear Cache & Reload</button></div>';
          var errorDetail = document.getElementById('error-detail');
          if (errorDetail) {
            errorDetail.textContent = 'Error: ' + (event.error ? event.error.toString() : event.message);
          }
        }
      });

      // Catch unhandled promise rejections
      window.addEventListener('unhandledrejection', function(event) {
        console.error('Unhandled promise rejection:', event.reason);
      });
    </script>
  </body>
</html>
