apiVersion: apps/v1
kind: Deployment
metadata:
  name: mortgage-crm-api
  namespace: mortgage-crm
  labels:
    app.kubernetes.io/name: mortgage-crm
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: mortgage-crm
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mortgage-crm
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: mortgage-crm-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      # Anti-affinity for high availability
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: mortgage-crm
                    app.kubernetes.io/component: api
                topologyKey: kubernetes.io/hostname
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: mortgage-crm
                    app.kubernetes.io/component: api
                topologyKey: topology.kubernetes.io/zone

      # Init container to wait for dependencies
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres-primary 5432; do echo waiting for database; sleep 2; done']
        - name: run-migrations
          image: mortgage-crm/api:latest
          command: ['python', '-c', 'from migrations.add_enterprise_tables import run_migration; run_migration()']
          envFrom:
            - configMapRef:
                name: mortgage-crm-config
            - secretRef:
                name: mortgage-crm-secrets

      containers:
        - name: api
          image: mortgage-crm/api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: mortgage-crm-config
            - secretRef:
                name: mortgage-crm-secrets

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"

          # Liveness probe - is the process alive?
          livenessProbe:
            httpGet:
              path: /api/v1/enterprise/health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness probe - can we accept traffic?
          readinessProbe:
            httpGet:
              path: /api/v1/enterprise/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          # Startup probe - for slow-starting containers
          startupProbe:
            httpGet:
              path: /api/v1/enterprise/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.cache

      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}

      # Graceful shutdown
      terminationGracePeriodSeconds: 30

      # Topology spread for zone redundancy
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mortgage-crm
              app.kubernetes.io/component: api
---
apiVersion: v1
kind: Service
metadata:
  name: mortgage-crm-api
  namespace: mortgage-crm
  labels:
    app.kubernetes.io/name: mortgage-crm
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: mortgage-crm
    app.kubernetes.io/component: api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mortgage-crm-api
  namespace: mortgage-crm
  labels:
    app.kubernetes.io/name: mortgage-crm
    app.kubernetes.io/component: api
