# External Secrets Operator integration
# These templates pull secrets from HashiCorp Vault or AWS Secrets Manager
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mortgage-crm-secrets
  namespace: mortgage-crm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mortgage-crm-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: mortgage-crm/database
        property: url
    - secretKey: SECRET_KEY
      remoteRef:
        key: mortgage-crm/app
        property: secret_key
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: mortgage-crm/encryption
        property: master_key
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: mortgage-crm/ai
        property: anthropic_key
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: mortgage-crm/ai
        property: openai_key
    - secretKey: TWILIO_AUTH_TOKEN
      remoteRef:
        key: mortgage-crm/twilio
        property: auth_token
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: mortgage-crm/stripe
        property: secret_key
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: mortgage-crm/redis
        property: password
    - secretKey: RABBITMQ_PASSWORD
      remoteRef:
        key: mortgage-crm/rabbitmq
        property: password
---
# Fallback: Manual secret (for environments without External Secrets)
apiVersion: v1
kind: Secret
metadata:
  name: mortgage-crm-secrets-manual
  namespace: mortgage-crm
  annotations:
    description: "Manual secrets - replace with External Secrets in production"
type: Opaque
stringData:
  # IMPORTANT: Replace these placeholder values
  DATABASE_URL: "postgresql://user:password@postgres:5432/mortgage_crm"
  SECRET_KEY: "CHANGE_ME_IN_PRODUCTION"
  ENCRYPTION_KEY: "CHANGE_ME_32_BYTE_BASE64_KEY"
---
apiVersion: v1
kind: Secret
metadata:
  name: docker-registry-secret
  namespace: mortgage-crm
type: kubernetes.io/dockerconfigjson
data:
  # Base64 encoded Docker config - replace with actual registry credentials
  .dockerconfigjson: e30=
