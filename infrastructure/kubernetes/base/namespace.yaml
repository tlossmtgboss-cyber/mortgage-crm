apiVersion: v1
kind: Namespace
metadata:
  name: mortgage-crm
  labels:
    app.kubernetes.io/name: mortgage-crm
    app.kubernetes.io/component: platform
    environment: production
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: mortgage-crm-quota
  namespace: mortgage-crm
spec:
  hard:
    requests.cpu: "50"
    requests.memory: 100Gi
    limits.cpu: "100"
    limits.memory: 200Gi
    persistentvolumeclaims: "20"
    services.loadbalancers: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: mortgage-crm-limits
  namespace: mortgage-crm
spec:
  limits:
  - default:
      cpu: "1"
      memory: 1Gi
    defaultRequest:
      cpu: "100m"
      memory: 256Mi
    type: Container
