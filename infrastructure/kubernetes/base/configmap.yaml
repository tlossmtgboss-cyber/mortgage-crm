apiVersion: v1
kind: ConfigMap
metadata:
  name: mortgage-crm-config
  namespace: mortgage-crm
  labels:
    app.kubernetes.io/name: mortgage-crm
data:
  # Application Settings
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"

  # API Settings
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  API_WORKERS: "4"

  # Database Settings (connection string in secrets)
  DB_POOL_SIZE: "10"
  DB_MAX_OVERFLOW: "20"
  DB_POOL_TIMEOUT: "30"
  DB_POOL_RECYCLE: "1800"

  # Redis Settings
  REDIS_HOST: "redis-cluster.mortgage-crm.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  # RabbitMQ Settings
  RABBITMQ_HOST: "rabbitmq.mortgage-crm.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  RABBITMQ_VHOST: "mortgage"

  # Feature Flags
  ENABLE_MFA: "true"
  ENABLE_AUDIT_LOGGING: "true"
  ENABLE_DISTRIBUTED_TRACING: "true"
  ENABLE_METRICS: "true"

  # Observability
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4317"
  OTEL_SERVICE_NAME: "mortgage-crm-api"
  SENTRY_ENVIRONMENT: "production"

  # CORS Settings
  ALLOWED_ORIGINS: "https://app.mortgagecrm.com,https://portal.mortgagecrm.com"

  # Rate Limiting
  RATE_LIMIT_PER_MINUTE: "100"
  RATE_LIMIT_PER_HOUR: "2000"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mortgage-crm-nginx-config
  namespace: mortgage-crm
data:
  nginx.conf: |
    upstream api_servers {
        least_conn;
        server api-service:8000;
    }

    server {
        listen 80;
        server_name _;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # API proxy
        location /api {
            proxy_pass http://api_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Static files
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
