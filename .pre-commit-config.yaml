# .pre-commit-config.yaml — copy this to repo root
# Install: pip install pre-commit && pre-commit install

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets
        description: Block commits that contain secrets
        entry: gitleaks protect --verbose --redact --staged
        language: system

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package-lock.json|yarn.lock|pnpm-lock.yaml

  # Python backend checks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        # E722 = no bare except. B = flake8-bugbear. E/F = standard.
        args: [--fix, --select, "E,F,E722,B"]
      - id: ruff-format

  # Mypy type-checking for backend (Slice F scope — must mirror mypy.ini `files = ...`)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        name: mypy (backend)
        args: [--config-file=mypy.ini]
        files: '^backend/(auth/.*\.py|middleware/.*\.py|agents/orchestration/.*\.py|agents/nodes/.*\.py|agents/service/_(response|session|tools|voice)\.py|services/loan_state_audit_service\.py|services/loan_reconciliation_service\.py|services/salesforce/_(auth|mapping|queries|state|webhooks)\.py|services/websocket_session_manager\.py|services/call_queue_stats\.py|services/call_quality_scorer\.py|services/los_integration/.*\.py|services/compliance/.*\.py|services/calculator_scenarios/.*\.py|services/aria_memory/.*\.py|services/calendar_providers/.*\.py|services/media/.*\.py|services/service_cost_integrations/.*\.py|services/content_marketing/.*\.py|services/pos/.*\.py|services/learning/.*\.py|services/appointment/.*\.py|services/application_engine/.*\.py|db\.py|database/models/.*\.py|schemas/.*\.py|routes/(security_monitoring|agent_governance_metrics|slybroadcast_webhook)_routes\.py|workflows/.*\.py)$'
        additional_dependencies:
          - types-redis
          - types-requests

  # Frontend checks
  - repo: local
    hooks:
      - id: no-duplicate-get-current-user
        name: Block new get_current_user duplicates in routes/api
        description: |
          Stops the auth-duplication regression. There are already ~146 copies
          of get_current_user across the codebase; do not add more in
          backend/routes/ or backend/api/. Import from auth.dependencies instead.
        entry: >-
          bash -c 'files=$(git diff --cached --name-only --diff-filter=AM
          | grep -E "^backend/(routes|api)/.*\.py$" || true);
          if [ -z "$files" ]; then exit 0; fi;
          bad="";
          for f in $files; do
          if grep -nE "^[[:space:]]*(async[[:space:]]+)?def[[:space:]]+get_current_user[[:space:]]*\(" "$f" >/dev/null 2>&1;
          then bad="$bad $f"; fi; done;
          if [ -n "$bad" ]; then
          echo "ERROR new get_current_user definition(s) detected in$bad";
          echo "Import from auth.dependencies instead of redefining.";
          exit 1; fi; exit 0'
        language: system
        pass_filenames: false

      - id: no-localstorage-jwt
        name: Block localStorage JWT patterns
        description: Prevent regression to localStorage auth
        entry: bash -c 'if grep -rn --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" "localStorage\.\(set\|get\|remove\)Item.*\(token\|jwt\|auth\)" frontend/src/; then echo "localStorage auth tokens are not allowed. Use httpOnly cookies."; exit 1; fi'
        language: system
        pass_filenames: false

      - id: no-console-log-prod
        name: Warn on console.log in production code
        entry: bash -c 'git diff --cached --name-only | grep -E "\.(ts|tsx|js|jsx)$" | xargs -r grep -l "console\.log" | grep -v ".test." | grep -v ".spec." && echo "Remove console.log or use logger.info"; exit 0'
        language: system
        pass_filenames: false
