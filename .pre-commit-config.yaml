# .pre-commit-config.yaml — copy this to repo root
# Install: pip install pre-commit && pre-commit install

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets
        description: Block commits that contain secrets
        entry: gitleaks protect --verbose --redact --staged
        language: system

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package-lock.json|yarn.lock|pnpm-lock.yaml

  # Python backend checks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        # E722 = no bare except. B = flake8-bugbear. E/F = standard.
        args: [--fix, --select, "E,F,E722,B"]
      - id: ruff-format

  # Mypy type-checking for backend.
  # Wave 6 D2: scope broadened to ~2,016 files (~67 % of backend) via a coarse
  # directory-based regex. Whatever ends up in `mypy.ini` `files = ...` should
  # be reachable via this regex. Excludes: tests, migrations, alembic, scripts,
  # examples, docs, and `remediation/` (numeric folder names collide).
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        name: mypy (backend)
        args: [--config-file=mypy.ini]
        exclude: '^backend/(tests|migrations|alembic|scripts|examples|docs|remediation|seeds/__pycache__)/'
        files: '^backend/(auth|middleware|db\.py|schemas|database/models|workflows|jobs|tasks|utils|integrations|api|telephony|monitoring|ai_receptionist|ai_providers|scrapers|soc2|soc2_compliance|validators|validation|intake_engine|seeds|aria|crud|tools|ab_testing|income_engine|workers|smart_docs_remediation|core|constants|uvip|config|models|services|routes|agents/(orchestration|nodes|service|tools|autonomous|memory|metrics|challenge|specialized|urla|utils|prompts|orchestrator\.py|state\.py|service_governance\.py))(/.*\.py|$)'
        additional_dependencies:
          - types-redis
          - types-requests

  # Frontend checks
  - repo: local
    hooks:
      - id: no-duplicate-get-current-user
        name: Block new get_current_user duplicates in routes/api
        description: |
          Stops the auth-duplication regression. There are already ~146 copies
          of get_current_user across the codebase; do not add more in
          backend/routes/ or backend/api/. Import from auth.dependencies instead.
        entry: >-
          bash -c 'files=$(git diff --cached --name-only --diff-filter=AM
          | grep -E "^backend/(routes|api)/.*\.py$" || true);
          if [ -z "$files" ]; then exit 0; fi;
          bad="";
          for f in $files; do
          if grep -nE "^[[:space:]]*(async[[:space:]]+)?def[[:space:]]+get_current_user[[:space:]]*\(" "$f" >/dev/null 2>&1;
          then bad="$bad $f"; fi; done;
          if [ -n "$bad" ]; then
          echo "ERROR new get_current_user definition(s) detected in$bad";
          echo "Import from auth.dependencies instead of redefining.";
          exit 1; fi; exit 0'
        language: system
        pass_filenames: false

      - id: no-localstorage-jwt
        name: Block localStorage JWT patterns
        description: Prevent regression to localStorage auth
        entry: bash -c 'if grep -rn --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" "localStorage\.\(set\|get\|remove\)Item.*\(token\|jwt\|auth\)" frontend/src/; then echo "localStorage auth tokens are not allowed. Use httpOnly cookies."; exit 1; fi'
        language: system
        pass_filenames: false

      - id: no-console-log-prod
        name: Warn on console.log in production code
        entry: bash -c 'git diff --cached --name-only | grep -E "\.(ts|tsx|js|jsx)$" | xargs -r grep -l "console\.log" | grep -v ".test." | grep -v ".spec." && echo "Remove console.log or use logger.info"; exit 0'
        language: system
        pass_filenames: false
