[mypy]
python_version = 3.11
ignore_missing_imports = True
no_strict_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
follow_imports = silent
files = backend/auth/, backend/middleware/, backend/agents/orchestration/, backend/services/loan_state_audit_service.py, backend/services/loan_reconciliation_service.py

# Suppress noisy errors from dependency-injected SQLAlchemy/Pydantic patterns
[mypy-backend.auth.*]
disable_error_code = misc, type-arg

[mypy-backend.middleware.*]
disable_error_code = misc, type-arg

[mypy-backend.agents.orchestration.*]
disable_error_code = misc, type-arg
