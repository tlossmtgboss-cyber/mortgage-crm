}

function loadFeature() {
  var params = new URLSearchParams(window.location.search);
  var featureId = params.get('id');

  if (!featureId) {
    window.location.href = 'index.html#features';
    return;
  }

  fetch('data/features.json?v=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var feature = data.features.find(function(f) { return f.id === featureId; });
      if (feature) {
        renderFeature(feature);
      } else {
        document.getElementById('feature-content').innerHTML = '<div class="loading"><p>Feature not found. <a href="index.html#features">View all features</a></p></div>';
      }
    })
    .catch(function() {
      document.getElementById('feature-content').innerHTML = '<div class="loading"><p>Error loading feature. <a href="index.html#features">View all features</a></p></div>';
    });
}

function openDemoModal() {
  document.getElementById('demo-modal').style.display = 'flex';
}

function closeDemoModal() {
  document.getElementById('demo-modal').style.display = 'none';
}

function submitDemoRequest(e) {
  e.preventDefault();
  var form = e.target;
  var btn = form.querySelector('button[type="submit"]');
  btn.textContent = 'Submitting...';
  btn.disabled = true;

  // Simulate submission
  setTimeout(function() {
    form.innerHTML = '<div style="text-align:center;padding:20px;"><h3 style="color:var(--navy);margin-bottom:12px;">Thank You!</h3><p style="color:var(--gray-600);">We\'ll be in touch within 24 hours to schedule your demo.</p></div>';
  }, 1500);
}

document.addEventListener('click', function(e) {
  if (e.target.id === 'demo-modal') closeDemoModal();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeDemoModal();
});

document.addEventListener('DOMContentLoaded', loadFeature);
