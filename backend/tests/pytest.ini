[pytest]
# Perennia AI Test Configuration
# Production-Grade Testing & Reliability

# Test markers for filtering
markers =
    unit: Fast isolated tests with mocked dependencies
    integration: Tests with real external services
    e2e: Full conversation flow tests
    regression: Golden response comparisons
    golden: Critical business flow tests (must pass for deployment)
    contract: API contract tests
    ai: AI agent behavior tests
    agents: Agent-specific tests
    qa: Quality assurance tests
    critical: Tests that must pass (blocking)
    slow: Tests that take > 5 seconds
    security: Security-focused tests (auth, encryption, access control)
    compliance: Regulatory compliance tests (TRID, RESPA, TCPA, BSA)
    tenant_isolation: Multi-tenant data isolation boundary tests
    income_accuracy: Income calculation correctness and trending tests
    esign_compliance: E-signature legal compliance tests (ESIGN Act, UETA)
    api_contract: API request/response shape and contract tests
    performance: Performance benchmark tests (skip in CI)

# Default options
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings

# Test discovery
testpaths =
    tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async mode
asyncio_mode = auto

# Timeout for tests
timeout = 30
timeout_method = thread

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S

# Coverage configuration (pytest-cov)
# Enable coverage by default - 85% minimum threshold
# Run: pytest --cov (uses settings from pyproject.toml)
#
# For per-module thresholds, run after pytest:
#   pytest --cov=. --cov-report=json
#   python scripts/check_coverage.py
#
# Module thresholds:
#   - Security (auth/): 95%
#   - Financial services: 95%
#   - API routes: 90%
#   - Services: 85%
#   - Overall: 85%

# Parallel execution (if pytest-xdist installed)
# addopts = -n auto
