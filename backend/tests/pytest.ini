[pytest]
# Perennia AI Test Configuration
# Production-Grade Testing & Reliability

# Test markers for filtering
markers =
    unit: Fast isolated tests with mocked dependencies
    integration: Tests with real external services
    e2e: Full conversation flow tests
    regression: Golden response comparisons
    golden: Critical business flow tests (must pass for deployment)
    contract: API contract tests
    ai: AI agent behavior tests
    agents: Agent-specific tests
    qa: Quality assurance tests
    critical: Tests that must pass (blocking)
    slow: Tests that take > 5 seconds

# Default options
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings

# Test discovery
testpaths =
    tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async mode
asyncio_mode = auto

# Timeout for tests
timeout = 30
timeout_method = thread

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S

# Coverage (if pytest-cov installed)
# addopts = --cov=. --cov-report=term-missing

# Parallel execution (if pytest-xdist installed)
# addopts = -n auto
