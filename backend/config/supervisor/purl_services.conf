; =============================================================================
; Supervisor Configuration for PURL System Services
; =============================================================================
; This configuration manages the following PURL-related services:
; - Main API server (FastAPI/Uvicorn)
; - PURL event processor (background job)
; - Celery worker (for async tasks)
; - Celery beat (for scheduled tasks)
;
; Installation:
;   sudo cp purl_services.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread
;   sudo supervisorctl update
;
; Usage:
;   sudo supervisorctl start purl:*       # Start all services
;   sudo supervisorctl stop purl:*        # Stop all services
;   sudo supervisorctl restart purl:*     # Restart all services
;   sudo supervisorctl status purl:*      # Check status
; =============================================================================

[group:purl]
programs=purl_api,purl_worker,purl_beat,purl_event_processor

; -----------------------------------------------------------------------------
; Main API Server
; -----------------------------------------------------------------------------
[program:purl_api]
command=/home/app/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4
directory=/home/app/backend
user=app
numprocs=1
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=30
stopasgroup=true
killasgroup=true
environment=
    PATH="/home/app/venv/bin",
    PYTHONPATH="/home/app/backend"
stdout_logfile=/var/log/purl/api.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/purl/api_error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

; -----------------------------------------------------------------------------
; PURL Event Processor (Background Job)
; -----------------------------------------------------------------------------
[program:purl_event_processor]
command=/home/app/venv/bin/python jobs/purl_event_processor.py
directory=/home/app/backend
user=app
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=30
environment=
    PATH="/home/app/venv/bin",
    PYTHONPATH="/home/app/backend"
stdout_logfile=/var/log/purl/event_processor.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=/var/log/purl/event_processor_error.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5

; -----------------------------------------------------------------------------
; Celery Worker (Async Task Processing)
; -----------------------------------------------------------------------------
[program:purl_worker]
command=/home/app/venv/bin/celery -A tasks.celery_app worker --loglevel=INFO --concurrency=4
directory=/home/app/backend
user=app
numprocs=1
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=60
stopasgroup=true
killasgroup=true
environment=
    PATH="/home/app/venv/bin",
    PYTHONPATH="/home/app/backend",
    C_FORCE_ROOT="false"
stdout_logfile=/var/log/purl/worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/purl/worker_error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

; -----------------------------------------------------------------------------
; Celery Beat (Scheduled Tasks)
; -----------------------------------------------------------------------------
[program:purl_beat]
command=/home/app/venv/bin/celery -A tasks.celery_app beat --loglevel=INFO
directory=/home/app/backend
user=app
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=30
environment=
    PATH="/home/app/venv/bin",
    PYTHONPATH="/home/app/backend"
stdout_logfile=/var/log/purl/beat.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=/var/log/purl/beat_error.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5
