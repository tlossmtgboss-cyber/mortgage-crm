# .gitleaks.toml — custom rules for Perennia's specific integrations
# Place at repo root

title = "Perennia AI gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "telnyx-api-key"
description = "Telnyx API key"
regex = '''KEY[0-9A-Za-z_\-]{20,}'''
tags = ["key", "telnyx"]

[[rules]]
id = "vapi-api-key"
description = "Vapi API key"
regex = '''(?i)vapi[_\-]?(api[_\-]?)?key[\"']?\s*[:=]\s*[\"']?[a-f0-9\-]{32,}[\"']?'''
tags = ["key", "vapi"]

[[rules]]
id = "cartesia-api-key"
description = "Cartesia API key"
regex = '''(?i)cartesia[_\-]?(api[_\-]?)?key[\"']?\s*[:=]\s*[\"']?[A-Za-z0-9_\-]{32,}[\"']?'''
tags = ["key", "cartesia"]

[[rules]]
id = "deepgram-api-key"
description = "Deepgram API key"
regex = '''(?i)deepgram[_\-]?(api[_\-]?)?key[\"']?\s*[:=]\s*[\"']?[a-f0-9]{40}[\"']?'''
tags = ["key", "deepgram"]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-api03-[A-Za-z0-9_\-]{80,}'''
tags = ["key", "anthropic"]

[[rules]]
id = "jwt-secret-long"
description = "JWT signing secret"
regex = '''(?i)(jwt[_\-]?secret|secret[_\-]?key)[\"']?\s*[:=]\s*[\"'][A-Za-z0-9+/=]{32,}[\"']'''
tags = ["key", "jwt"]

# Allow test fixtures that clearly use placeholder values
[allowlist]
description = "Allow clearly-placeholder test values"
regexes = [
  '''test[_\-]?token[_\-]?(fixture|placeholder)''',
  '''FAKE_[A-Z_]+_FOR_TESTS''',
  '''example\.com''',
]
paths = [
  '''tests/fixtures/.*\.py$''',
  '''frontend/src/__mocks__/.*''',
]
