# 04-migrations/alembic.ini
# Drop-in: backend/alembic.ini

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url is overridden by env.py using DATABASE_URL env var
sqlalchemy.url = driver://user:pass@localhost/dbname

# File template — includes date for ordering
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Truncate slug to keep filenames sane
truncate_slug_length = 60

# Run migrations in a transaction per migration (safer)
transaction_per_migration = true

# Post-write hooks — format migrations with ruff for consistency
[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
