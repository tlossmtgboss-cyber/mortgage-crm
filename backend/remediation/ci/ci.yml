# ci/ci.yml
# Drop-in: .github/workflows/ci.yml
#
# Main CI — runs on every PR. Everything below must pass before merge.

name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Backend ---------------------------------------------------------------

  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: |
          cd backend
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff check
        run: cd backend && ruff check .
      - name: Ruff format
        run: cd backend && ruff format --check .

  backend-typecheck:
    name: Backend typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          cd backend
          pip install -r requirements.txt -r requirements-dev.txt
          mypy app/

  backend-test:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: perennia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/perennia_test
      DATABASE_MIGRATE_URL: postgresql+asyncpg://test:test@localhost:5432/perennia_test
      REDIS_URL: redis://localhost:6379/0
      ENV: test
      # Test-only keys — NEVER use in production
      PII_ENCRYPTION_KEY: ${{ secrets.TEST_PII_ENCRYPTION_KEY }}
      JWT_PRIVATE_KEY: ${{ secrets.TEST_JWT_PRIVATE_KEY }}
      JWT_PUBLIC_KEY: ${{ secrets.TEST_JWT_PUBLIC_KEY }}
      ANTHROPIC_API_KEY: sk-test-fake
      COOKIE_DOMAIN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          cd backend
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Enable pgcrypto
        run: psql "postgresql://test:test@localhost:5432/perennia_test" -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
      - name: Run migrations
        run: cd backend && alembic upgrade head
      - name: Pytest with coverage
        run: |
          cd backend
          pytest \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=60 \
            -n auto
      - uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend

  # --- Frontend --------------------------------------------------------------

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run typecheck

  frontend-test:
    name: Frontend tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: cd frontend && npm ci
      - run: cd frontend && npm test -- --run --coverage
      - uses: codecov/codecov-action@v4
        with:
          file: frontend/coverage/coverage-final.json
          flags: frontend

  frontend-build:
    name: Frontend build + size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build
      - name: Enforce size budgets
        run: cd frontend && node scripts/size-check.mjs
      - name: Upload bundle stats
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-stats
          path: frontend/dist/stats.html
          retention-days: 14

  # --- Migrations ------------------------------------------------------------

  migrations:
    name: Alembic up + down round-trip
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: perennia_migrate
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/perennia_migrate
      DATABASE_MIGRATE_URL: postgresql+asyncpg://test:test@localhost:5432/perennia_migrate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: cd backend && pip install -r requirements.txt
      - run: psql "postgresql://test:test@localhost:5432/perennia_migrate" -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
      - name: Upgrade head
        run: cd backend && alembic upgrade head
      - name: Downgrade base
        run: cd backend && alembic downgrade base
      - name: Upgrade head again
        run: cd backend && alembic upgrade head
      - name: Check for missing autogenerate
        run: |
          cd backend
          # If there are any pending model changes not reflected in migrations, fail.
          alembic check
