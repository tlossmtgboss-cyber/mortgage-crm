lo_coaching_overlay:
  version: "1.0.0"
  description: "Coaching scripts and next-best-questions for LO intervention"

  # Overlay selection triggers
  trigger_conditions:
    - hesitation_score_gte: 0.55
    - truth_band_in: ["YELLOW", "ORANGE", "RED"]
    - flags_present_any:
        - "FLAG_DECLARATIONS_YES_NO_DETAIL"
        - "FLAG_TRUTH_RISK_HIGH"
        - "FLAG_INCOME_INCONSISTENCY"
        - "FLAG_ASSETS_LOW_FOR_PRICE"

  overlays:
    COACH_VERIFY_NEXT:
      intent: "Light verification without friction"
      description: "Gentle follow-up to confirm uncertain answers"
      priority: 2
      trigger_conditions:
        - hesitation_band: "moderate"
        - flag: "FLAG_NEEDS_GENTLE_VERIFICATION"
      scripts:
        - "Just to make sure I'm lining this up correctly—what's the most recent pay period amount you remember seeing?"
        - "If you had to pick, is your monthly income closer to A, B, or C?"
        - "No worries if you're not 100% sure—a rough estimate works great here."
        - "Would it help if I gave you some ranges to choose from?"
      tactics:
        - "Offer 3-button range choices instead of exact number"
        - "Normalize uncertainty: 'Most people don't have this memorized'"
        - "Provide helpful context without judgment"
      next_best_questions:
        - when: { missing_question_id: "Q_INC_0303" }
          ask: "Q_INC_0303"
          approach: "range_selection"
        - when: { low_confidence_question: "Q_AST_0401" }
          ask: "Q_AST_0401"
          approach: "verification"
        - when: { flag: "FLAG_ASSET_GIFT" }
          ask: "Q_AST_0410"
          approach: "clarification"

    COACH_TRUTH_RECOVERY:
      intent: "Recover truth when answers feel soft or inconsistent"
      description: "More direct intervention for significant uncertainty"
      priority: 1
      trigger_conditions:
        - hesitation_band: "high"
        - flag: "FLAG_TRUTH_RISK_HIGH"
        - truth_score_lte: 55
      scripts:
        - "Totally normal—most people don't have these numbers memorized. Let's do the easiest version: what do you see deposited on payday?"
        - "If that number changes month to month, what's the lowest month you've had in the last 6 months?"
        - "Let's take a step back. Can you pull up your bank app? It'll make this super quick."
        - "I know these questions can feel tedious—let me explain why this one matters so we can get you the most accurate picture."
      tactics:
        - "Convert free-text into 3-button ranges"
        - "Anchor on evidence: paystub, bank deposit, offer letter"
        - "Avoid 'why' questions; use 'help me understand'"
        - "Normalize the situation—don't make them feel bad"
        - "Offer to pull up supporting documents together"
      next_best_questions:
        - when: { flag: "FLAG_INCOME_INCONSISTENCY" }
          ask: "Q_INC_0303"
          approach: "evidence_anchored"
          script: "Let's look at your most recent pay stub together—what's the gross amount shown?"
        - when: { flag: "FLAG_ASSETS_LOW_FOR_PRICE" }
          ask: "Q_AST_0402"
          approach: "discovery"
          script: "Sometimes people have accounts they forget about—any old 401ks, investment accounts, or CDs?"

    COACH_DECLARATIONS_DETAILS:
      intent: "Yes on declarations requires detail, fast"
      description: "Quick follow-up when borrower answers yes to declaration"
      priority: 1
      trigger_conditions:
        - flag: "FLAG_DECLARATIONS_YES"
        - flag: "FLAG_DECLARATIONS_YES_NO_DETAIL"
      scripts:
        - "Thanks—quick follow-up so we don't miss anything: was that bankruptcy Chapter 7 or 13?"
        - "Got it—when was that discharged? Even an approximate date helps."
        - "Appreciate you being upfront about that. Let me get a couple quick details so we can figure out your options."
      tactics:
        - "Be matter-of-fact, not judgmental"
        - "Emphasize this helps find the right loan program"
        - "Get the minimum required details quickly"
      next_best_questions:
        - when: { answers: { Q_DEC_0601: true }, missing: "Q_DEC_0602" }
          ask: "Q_DEC_0602"
          required: true
        - when: { answers: { Q_DEC_0601: true }, missing: "Q_DEC_0603" }
          ask: "Q_DEC_0603"
          required: true
        - when: { answers: { Q_DEC_0610: true }, missing: "Q_DEC_0611" }
          ask: "Q_DEC_0611"
          required: true

    COACH_DTI_CONCERN:
      intent: "Address potential DTI issues proactively"
      description: "Help borrower understand debt-to-income implications"
      priority: 3
      trigger_conditions:
        - flag: "FLAG_DTI_CONCERN"
      scripts:
        - "Based on what you've shared, your debt-to-income ratio might be on the higher side. Let's make sure we have everything right."
        - "Are there any debts that might be paid off soon? Sometimes that changes things."
        - "Is there any additional income we haven't captured yet?"
      tactics:
        - "Don't alarm the borrower"
        - "Look for ways to improve the picture"
        - "Verify accuracy of debt amounts"
      next_best_questions:
        - when: { flag: "FLAG_DTI_CONCERN" }
          ask: "Q_LIA_0507"
          approach: "discovery"

    COACH_INVESTMENT_PROPERTY:
      intent: "Gather investment property details"
      description: "Additional questions for investment property applications"
      priority: 2
      trigger_conditions:
        - flag: "FLAG_OCC_INVESTMENT"
      scripts:
        - "For investment properties, we need to understand the rental income potential. What rent do you expect?"
        - "Will you be using a property manager, or self-managing?"
        - "Do you have experience as a landlord?"
      next_best_questions:
        - when: { flag: "FLAG_OCC_INVESTMENT", missing: "Q_RENT_0118" }
          ask: "Q_RENT_0118"
          required: true

    COACH_SELF_EMPLOYED:
      intent: "Navigate self-employment documentation"
      description: "Help self-employed borrowers understand requirements"
      priority: 2
      trigger_conditions:
        - flag: "FLAG_SELF_EMPLOYED"
      scripts:
        - "Great—being your own boss has perks! For self-employed borrowers, we calculate income a bit differently. Let me walk you through it."
        - "We'll typically look at your last 2 years of tax returns. Do you have those handy?"
        - "How's business been this year compared to last year? Growing, stable, or a bit slower?"
      tactics:
        - "Normalize the extra documentation"
        - "Explain why tax returns are used"
        - "Look for year-over-year trends"
      next_best_questions:
        - when: { flag: "FLAG_SELF_EMPLOYED", missing: "Q_INC_0312" }
          ask: "Q_INC_0312"
        - when: { flag: "FLAG_SELF_EMPLOYED", missing: "Q_INC_0313" }
          ask: "Q_INC_0313"

  # Response templates for uncertainty
  uncertainty_responses:
    income_uncertain:
      offer_ranges: true
      ranges:
        - { min: 3000, max: 5000, label: "Around $3,000-$5,000" }
        - { min: 5000, max: 8000, label: "Around $5,000-$8,000" }
        - { min: 8000, max: 12000, label: "Around $8,000-$12,000" }
        - { min: 12000, max: 20000, label: "Around $12,000-$20,000" }
      follow_up: "We'll verify the exact amount with your pay stubs later."

    assets_uncertain:
      offer_ranges: true
      ranges:
        - { min: 10000, max: 25000, label: "$10,000-$25,000" }
        - { min: 25000, max: 50000, label: "$25,000-$50,000" }
        - { min: 50000, max: 100000, label: "$50,000-$100,000" }
        - { min: 100000, max: null, label: "Over $100,000" }
      follow_up: "We'll verify with bank statements later."

    date_uncertain:
      offer_options:
        - "Within the last year"
        - "1-2 years ago"
        - "2-4 years ago"
        - "More than 4 years ago"
      follow_up: "We can look up the exact date later if needed."

  # LO notification triggers
  lo_notifications:
    - trigger: { overlay: "COACH_TRUTH_RECOVERY" }
      notify: true
      urgency: "high"
      message: "Borrower showing significant uncertainty - may need LO call"

    - trigger: { truth_score_lte: 40 }
      notify: true
      urgency: "critical"
      message: "Very low truth score - immediate LO review recommended"

    - trigger: { flag: "FLAG_DECLARATIONS_YES_NO_DETAIL" }
      notify: true
      urgency: "high"
      message: "Declaration answered yes without details"
