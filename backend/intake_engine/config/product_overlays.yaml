      - "occupancy clarity"
      - "assets sourcing"
      - "declared liabilities completeness"
    followup_bias:
      income_verification: 1.0
      assets_large_deposits: 1.2
      declarations_details: 1.1

  FREDDIE:
    focus:
      - "employment stability narrative"
      - "rental/investment logic"
    followup_bias:
      income_stability: 1.2
      property_rent: 1.2

  FHA:
    focus:
      - "gift sourcing and documentation intent"
      - "credit event timeline clarity"
    followup_bias:
      assets_gift: 1.3
      credit_event_dates: 1.3

  VA:
