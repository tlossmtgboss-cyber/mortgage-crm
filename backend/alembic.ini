# Alembic Configuration
# Perennia AI - Mortgage CRM

[alembic]
# Path to migration scripts
script_location = alembic

# Template for new migrations
file_template = %%(rev)s_%%(slug)s

# Timezone for revision creation
# timezone =

# Max length of characters in slug field
truncate_slug_length = 40

# Prepend date/time to migration message
# prepend_date = True

# Version path separator - determines how versions are separated in the version table
version_path_separator = os  # default: use os.pathsep

# Output encoding for autogenerate operations
# output_encoding = utf-8

# Database URL — this placeholder is ALWAYS overridden at runtime by
# env.py which reads the DATABASE_URL environment variable.
# Never put a real connection string here.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Optional post-write hooks (e.g., for code formatting)
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
