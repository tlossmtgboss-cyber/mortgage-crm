[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "perennia-crm"
version = "1.0.0"
description = "Perennia AI Mortgage CRM Backend"
requires-python = ">=3.10"

[tool.ruff]
# Enforce no bare excepts going forward. Other agents may extend this block.
target-version = "py310"

[tool.ruff.lint]
# E722 = bare `except:`; BLE001 = blind `except Exception:` without naming/handling.
select = ["E722", "BLE001"]
extend-select = []

[tool.ruff.lint.per-file-ignores]
# Migrations and tests are allowed to keep broad excepts.
"migrations/**" = ["BLE001", "E722"]
"alembic/**" = ["BLE001", "E722"]
"tests/**" = ["BLE001", "E722"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

# Test markers for layered testing strategy
markers = [
    "unit: Fast isolated tests with no external dependencies",
    "integration: Tests that require external services (APIs, databases)",
    "e2e: End-to-end conversation flow tests",
    "regression: Golden response comparison tests",
    "contract: API schema contract tests",
    "golden: Golden flow critical path tests",
    "critical: Critical path tests that must pass before deployment",
    "slow: Tests that take longer than 5 seconds",
    "ai: Tests for AI features and LLM integrations",
    "agents: Tests for AI agents",
    "tools: Tests for agent tools",
    "orchestrator: Tests for agent orchestration/routing",
    "performance: Performance and load tests (skipped in CI by default)",
    "security: Security-focused tests for auth, tenant isolation, input validation, and attack vectors",
    "esign_compliance: E-signature legal compliance tests (ESIGN Act, UETA, TRID)",
    "compliance: Regulatory compliance tests (TRID, RESPA, TCPA, BSA)",
    "tenant_isolation: Multi-tenant data isolation boundary tests",
    "income_accuracy: Income calculation correctness and trending tests",
    "api_contract: API request/response shape and contract tests",
]

# Default options
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "-ra",
]

# Filter warnings
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# Timeout for tests (requires pytest-timeout)
timeout = 30

[tool.coverage.run]
# Source layout: when pytest runs from backend/ the package paths are bare
# ("agents", "services", ...). The CI workflow runs from repo root and uses
# --cov=backend, so the "backend" subpath is also honored as a fallback.
source = ["backend", "agents", "services", "routes", "auth", "core", "middleware", "database"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/venv/*",
    "*/.venv/*",
    "*/alembic/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if self.debug:",
    "if settings.DEBUG",
    "@abstractmethod",
]
show_missing = true
# Wave 3 ramp: start at 5% to LOCK IN the floor and prevent regression.
# Long-term aspirational target is 85% (documented in tests/COVERAGE.md).
# Ramp schedule:
#   Wave 3 (now): 5%
#   Wave 4:       10%
#   Wave 5:       25%
#   Wave 6:       60%
#   Wave 7+:      85%
fail_under = 5
precision = 2

[tool.coverage.html]
directory = "htmlcov"
title = "Perennia CRM Coverage Report"

# Per-module coverage thresholds (enforced via CI)
# Security modules: 95%
# Financial calculations: 95%
# API endpoints: 90%
# Services: 85%
# Note: pytest-cov doesn't support per-module fail_under natively
# Use a custom script or CI step to enforce these

[tool.coverage.paths]
source = [
    ".",
    "/app",
]
