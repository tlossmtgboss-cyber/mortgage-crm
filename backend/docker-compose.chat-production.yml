version: '3.8'

# =============================================================================
# CHAT STATE MACHINE - PRODUCTION DEPLOYMENT
# =============================================================================
#
# Usage:
#   docker-compose -f docker-compose.chat-production.yml up -d
#
# Required environment variables (set in .env file):
#   - DATABASE_URL
#   - ANTHROPIC_API_KEY
#   - TWILIO_ACCOUNT_SID
#   - TWILIO_AUTH_TOKEN
#   - TWILIO_PHONE_NUMBER
#   - REDIS_URL (optional, defaults to internal)
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # API SERVER
  # ---------------------------------------------------------------------------
  chat-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - REDIS_URL=redis://redis:6379/0
      - BASE_URL=${BASE_URL:-https://chat.yourdomain.com}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      rollback_config:
        parallelism: 1
    networks:
      - chat-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chat-api.rule=Host(`chat.yourdomain.com`)"
      - "traefik.http.routers.chat-api.tls=true"
      - "traefik.http.routers.chat-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.chat-api.loadbalancer.server.port=8000"

  # ---------------------------------------------------------------------------
  # POSTGRESQL DATABASE
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${DB_NAME:-perennia_chat}
      - POSTGRES_USER=${DB_USER:-perennia}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-perennia} -d ${DB_NAME:-perennia_chat}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chat-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ---------------------------------------------------------------------------
  # REDIS CACHE
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chat-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # NOTE: nginx, prometheus, grafana, celery worker, and celery scheduler services
  # were removed — they referenced non-existent config files (./nginx/nginx.conf,
  # ./monitoring/prometheus.yml, ./monitoring/grafana/provisioning) and a Celery
  # tasks module that doesn't exist as a standalone entry point.
  # Re-add these services when the supporting config files are created.

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  chat-network:
    driver: bridge
