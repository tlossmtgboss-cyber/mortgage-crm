# NOTE: This file is a fallback — the root railway.toml is the primary config
# used by Railway (it references backend/Dockerfile and backend/start.py).
[deploy]
startCommand = "python3 start.py"
numReplicas = 1
healthcheckPath = "/health/live"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 15

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
