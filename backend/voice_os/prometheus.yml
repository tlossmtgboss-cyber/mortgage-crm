# Prometheus configuration for Voice OS

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'voice-os'
    environment: 'production'

scrape_configs:
  # Voice Orchestrator metrics
  - job_name: 'voice-orchestrator'
    static_configs:
      - targets: ['voice-orchestrator:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node exporter (if you add it)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

# Alerting rules
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Load recording rules
rule_files:
  # - "alerts/*.yml"
