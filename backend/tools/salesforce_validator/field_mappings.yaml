      task_type: Follow-up
      assigned_to: Processor_Queue
      escalation_after_hours: 48

  - source:
      object: loan
      field: title_received_at
      type: datetime
    destination:
      object: Loan__c
      field: Title_Received_Date__c
      type: Date
    transform: utc_to_date_only
    is_sla_field: true
    is_byte_mapped: true
    required: false
    sync_direction: push
    sla_config:
      window_days: 0
      workflow_name: Title_Review
      task_type: Title Review
      assigned_to: Processor_Queue
      escalation_after_hours: 24

  # ─── Conditions & Underwriting ────────────────────────────────────────

  - source:
      object: loan
      field: submitted_to_uw_at
      type: datetime
    destination:
      object: Loan__c
      field: Submitted_To_UW_Date__c
      type: Date
    transform: utc_to_date_only
    is_sla_field: true
    is_byte_mapped: true
    required: true
    sync_direction: push
    sla_config:
      window_days: 2
      workflow_name: UW_Followup
