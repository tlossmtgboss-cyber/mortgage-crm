# =============================================================================
# Perennia AI → Salesforce Field Mapping Configuration
# =============================================================================
# This file defines all field mappings between Perennia AI and Salesforce.
# It is the single source of truth for the validation suite.
#
# IMPORTANT: When adding a new field mapping:
# 1. Add the entry here
# 2. Run `python scripts/run_validation.py --mode quick` to verify
# 3. If it's an SLA field, also add the sla_config block
# 4. If it's a byte-mapped date, set is_byte_mapped: true
# =============================================================================

# -----------------------------------------------------------------------------
# Global Settings
# -----------------------------------------------------------------------------
settings:
  source_system: perennia_ai
  sf_api_version: "v59.0"
  default_sync_direction: push
  sync_latency_tolerance_seconds: 300
  date_comparison_tolerance_hours: 24

# -----------------------------------------------------------------------------
# Transform Definitions
# -----------------------------------------------------------------------------
transforms:
  utc_to_date_only:
    description: "Convert UTC datetime to date-only (YYYY-MM-DD) in user's timezone"
    input_type: datetime
    output_type: date
    notes: "Applies EST/EDT conversion before truncating time component"

  utc_passthrough:
    description: "Pass UTC datetime through unchanged"
    input_type: datetime
    output_type: datetime

  cents_to_dollars:
    description: "Convert integer cents to decimal dollars"
    input_type: integer
    output_type: decimal
    formula: "value / 100"

  decimal_to_percent:
    description: "Convert decimal rate (0.0425) to percentage (4.25)"
    input_type: decimal
    output_type: decimal
    formula: "value * 100"

  status_code_to_label:
    description: "Map internal status codes to Salesforce picklist labels"
    input_type: string
    output_type: string
    mapping:
      application: "Application"
      processing: "Processing"
      underwriting: "Underwriting"
      approved: "Approved"
      clear_to_close: "Clear to Close"
      closing: "Closing"
      funded: "Funded"
      denied: "Denied"
      withdrawn: "Withdrawn"

  normalize_phone_e164:
    description: "Normalize phone number to E.164 format (+1XXXXXXXXXX)"
    input_type: string
    output_type: string

  none:
    description: "No transformation applied"

# -----------------------------------------------------------------------------
# Field Mappings — Loan Origination SLA Dates
# These are the CRITICAL byte-mapped date fields that drive workflows.
# Every field here must pass validation or workflows will break.
# -----------------------------------------------------------------------------
mappings:

  # ─── Application & Disclosure ─────────────────────────────────────────

  - source:
      object: loan
      field: application_received_at
      type: datetime
    destination:
      object: Loan__c
      field: Application_Received_Date__c
      type: Date
    transform: utc_to_date_only
    is_sla_field: true
    is_byte_mapped: true
    required: true
    sync_direction: push
    sla_config:
      window_days: 0
      workflow_name: Initial_Doc_Review
      task_type: Document Review
      assigned_to: Processor_Queue
      escalation_after_hours: 24
      description: "Triggers initial document review task upon application receipt"

  - source:
      object: loan
      field: disclosure_sent_at
      type: datetime
    destination:
      object: Loan__c
      field: Disclosure_Sent_Date__c
      type: Date
    transform: utc_to_date_only
    is_sla_field: true
    is_byte_mapped: true
    required: true
    sync_direction: push
    sla_config:
      window_days: 3
      workflow_name: TRID_Compliance_Check
      task_type: Compliance Review
      assigned_to: Compliance_Team
      escalation_after_hours: 72
      description: "TRID compliance — must verify within 3 business days"

  - source:
      object: loan
      field: disclosure_acknowledged_at
      type: datetime
    destination:
      object: Loan__c
      field: Disclosure_Ack_Date__c
      type: Date
    transform: utc_to_date_only
    is_sla_field: true
    is_byte_mapped: true
    required: false
    sync_direction: push
    sla_config:
      window_days: 10
      workflow_name: Disclosure_Escalation
      task_type: Escalation
      assigned_to: Processor_Queue
      escalation_after_hours: 240
      description: "Escalate if borrower hasn't acknowledged disclosure within 10 days"

  # ─── Appraisal ────────────────────────────────────────────────────────

  - source:
