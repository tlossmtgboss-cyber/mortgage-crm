      description: "Follow up on appraisal order status within 1 business day"

  - source:
      object: loan
      field: appraisal_received_at
      type: datetime
    destination:
      object: Loan__c
      field: Appraisal_Received_Date__c
      type: Date
    transform: utc_to_date_only
    is_sla_field: true
    is_byte_mapped: true
    required: false
    sync_direction: push
    sla_config:
      window_days: 0
      workflow_name: Appraisal_Review
      task_type: Appraisal Review
      assigned_to: Processor_Queue
      escalation_after_hours: 24
      description: "Review appraisal immediately upon receipt"

  # ─── Title ────────────────────────────────────────────────────────────

