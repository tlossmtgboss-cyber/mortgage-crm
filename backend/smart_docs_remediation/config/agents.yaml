# ============================================================================
# SMART DOCS REMEDIATION — 100-AGENT REGISTRY
# ============================================================================
# Each agent maps 1:1 to a specific finding or sub-task from the critical
# analysis report. Agents are grouped by tier matching the report's priority.
#
# Fields:
#   id                : Stable identifier (used in logs, PR titles, metrics)
#   name              : Human-readable label
#   tier              : critical | important | consider | meta
#   finding_refs      : Findings from the report this agent addresses
#   mission           : What the agent is responsible for producing
#   inputs            : Paths/artifacts it needs to read
#   outputs           : Patches/files/migrations/tests it produces
#   depends_on        : Other agents that must complete first
#   tools             : Tool permissions (read, patch, migrate, test, deploy)
#   model             : claude-sonnet-4-5 | claude-opus-4-7 (risk-weighted)
#   autonomy          : auto | review_required | human_approval
#   risk              : low | medium | high
# ============================================================================

version: "1.0.0"
project: perennia-smart-docs-remediation
total_agents: 100

# ============================================================================
# CRITICAL TIER — 30 agents (Fix Now, blocks production)
# ============================================================================

agents:

  # ---- Finding #1: Document ID vs Request ID Confusion (8 agents) ----------

  - id: A01
    name: schema-id-auditor
    tier: critical
    finding_refs: [1]
    mission: >
      Inventory every id column across DocumentRequest, SmartDocument,
      BorrowerDocument, esign tables. Produce a canonical ERD labeling
      request_id vs document_id vs envelope_id. Flag every FK that blurs
      the two.
    inputs: [models/smart_docs/*.py, alembic/versions/*.py]
    outputs: [artifacts/erd.mmd, artifacts/id_inventory.json]
    depends_on: []
    tools: [read, static_analysis]
    model: claude-opus-4-7
    autonomy: auto
    risk: low

  - id: A02
    name: backend-id-usage-scanner
    tier: critical
    finding_refs: [1]
    mission: >
      AST-scan the FastAPI backend for every reference to `.id` and
      `.document_id` on smart-docs models. Produce a CSV of every call
      site with the inferred ID type. Mark ambiguous sites.
    inputs: [routes/smart_docs/*.py, services/smart_docs/*.py]
    outputs: [artifacts/id_call_sites.csv]
    depends_on: [A01]
    tools: [read, ast_walk]
    model: claude-sonnet-4-5
    autonomy: auto
    risk: low

  - id: A03
    name: frontend-id-usage-scanner
    tier: critical
    finding_refs: [1, 16]
    mission: >
      Scan React/TS sources for selectedDocs, doc.id, doc.document_id.
      Flag SmartDocsClientDetail.js lines 223–226, 345, 460 explicitly;
      produce a report of every conflation site.
    inputs: ["frontend/src/**/*.{js,jsx,ts,tsx}"]
    outputs: [artifacts/frontend_id_report.md]
    depends_on: [A01]
    tools: [read, ts_ast]
    model: claude-sonnet-4-5
    autonomy: auto
    risk: low

  - id: A04
    name: merge-flow-fixer
    tier: critical
    finding_refs: [1, 16]
    mission: >
      Patch SmartDocsClientDetail merge to validate document_id is non-null
      before building the merge array. Fall back to inline error toast when
      any selected request has no uploaded file.
    inputs: [frontend/src/pages/SmartDocs/SmartDocsClientDetail.js]
    outputs: [fixes/patches/A04-merge-flow.patch]
    depends_on: [A03]
    tools: [read, patch]
    model: claude-opus-4-7
    autonomy: review_required
    risk: medium

  - id: A05
    name: approve-reject-fixer
    tier: critical
    finding_refs: [1]
    mission: >
      Ensure approve/reject uses the uploaded document_id and rejects
      gracefully when the request has no upload yet. Add 409 response
      code to backend route.
    inputs:
      - frontend/src/pages/SmartDocs/SmartDocsClientDetail.js
      - routes/smart_docs/smart_docs_approval_routes.py
    outputs: [fixes/patches/A05-approve-reject.patch]
    depends_on: [A03, A02]
    tools: [read, patch]
    model: claude-opus-4-7
    autonomy: review_required
    risk: medium

  - id: A06
    name: rerequest-fixer
    tier: critical
    finding_refs: [1]
    mission: >
      Confirm re-request correctly uses request_id (not document_id).
      Add type hint and runtime assertion to the backend handler.
    inputs: [routes/smart_docs/smart_docs_request_routes.py]
    outputs: [fixes/patches/A06-rerequest.patch]
    depends_on: [A02]
    tools: [read, patch]
    model: claude-sonnet-4-5
    autonomy: auto
    risk: low

  - id: A07
    name: id-contract-validator
    tier: critical
    finding_refs: [1]
    mission: >
      Introduce RequestId and DocumentId NewTypes (Python) / branded
      types (TypeScript). Migrate signatures. A function accepting a
      RequestId should refuse to compile if passed a DocumentId.
    inputs: [models/smart_docs/, frontend/src/types/]
    outputs:
      - fixes/patches/A07-newtype-backend.patch
      - fixes/patches/A07-branded-frontend.patch
    depends_on: [A02, A03]
    tools: [read, patch]
    model: claude-opus-4-7
    autonomy: review_required
    risk: medium

  - id: A08
    name: id-regression-test-writer
    tier: critical
    finding_refs: [1]
    mission: >
      Write pytest + React Testing Library regression tests that would
      have caught the merge/approve/reject ID confusions. Tests must
      use a request with NO uploaded document and assert failure modes.
    inputs: [fixes/patches/A04*, fixes/patches/A05*]
    outputs:
      - tests/smart_docs/test_id_contract_backend.py
      - frontend/src/pages/SmartDocs/__tests__/id-contract.test.jsx
    depends_on: [A04, A05, A06]
    tools: [read, write_test]
    model: claude-sonnet-4-5
    autonomy: auto
    risk: low

