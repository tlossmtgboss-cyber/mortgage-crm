    risk: low

  # ---- Finding #3: Partial Failure Recovery (5 agents) ---------------------

  - id: A14
    name: esign-state-machine-designer
    tier: critical
    finding_refs: [3]
    mission: >
      Design a finite state machine for DocumentRequest.esign_status:
      NONE → ENVELOPE_PENDING → ENVELOPE_CREATED → SIGNED | FAILED.
      Every transition is logged. FAILED transitions record the cause.
    inputs: [models/smart_docs/document_request.py]
    outputs:
      - docs/esign_state_machine.md
      - models/smart_docs/esign_state.py
    depends_on: []
    tools: [read, write]
    model: claude-opus-4-7
    autonomy: review_required
    risk: medium

  - id: A15
    name: retry-endpoint-builder
    tier: critical
    finding_refs: [3]
    mission: >
      Build POST /smart-docs/requests/{request_id}/retry-esign. Idempotent.
      Only valid when esign_status = FAILED. Transitions to ENVELOPE_PENDING
      and enqueues the envelope worker.
    inputs: [models/smart_docs/esign_state.py]
    outputs: [fixes/patches/A15-retry-esign-endpoint.patch]
    depends_on: [A14]
    tools: [read, patch]
    model: claude-opus-4-7
    autonomy: review_required
    risk: medium

  - id: A16
    name: retry-ui-builder
    tier: critical
    finding_refs: [3]
    mission: >
      Add "Retry E-Sign Setup" button on requests where
      esign_status = FAILED. Show the failure reason on hover.
      Call POST /retry-esign; surface success/failure toast.
    inputs: [frontend/src/components/SmartDocs/RequestDocumentModal.jsx]
    outputs: [fixes/patches/A16-retry-ui.patch]
    depends_on: [A15]
    tools: [read, patch]
    model: claude-sonnet-4-5
    autonomy: auto
    risk: low

  - id: A17
    name: orphan-detector
    tier: critical
    finding_refs: [3]
    mission: >
      Celery beat job that runs every 10 minutes: finds DocumentRequests
      with esign_status = ENVELOPE_PENDING older than 5 min. Transitions
      to FAILED with reason=TIMEOUT. Emits metric smart_docs.esign.orphan.
    inputs: [models/smart_docs/esign_state.py]
    outputs:
      - workers/smart_docs/orphan_detector.py
      - celery_beat_schedule.py
    depends_on: [A14]
    tools: [read, write, celery]
    model: claude-sonnet-4-5
    autonomy: auto
    risk: low

  - id: A18
