name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run API Tests
        run: npx playwright test tests/api.spec.js --project=chromium
        env:
          API_BASE_URL: ${{ vars.STAGING_API_URL || 'http://localhost:8000' }}

      - name: Run E2E Tests
        run: npx playwright test --project=chromium --ignore-pattern="**/api.spec.js"
        env:
          TEST_BASE_URL: ${{ vars.STAGING_FRONTEND_URL || 'http://localhost:5173' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: frontend/test-results/
          retention-days: 7
