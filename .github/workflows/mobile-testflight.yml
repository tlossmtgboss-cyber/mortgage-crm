# .github/workflows/mobile-testflight.yml
# Deploy to TestFlight — triggered by version tags or manual dispatch
#
# Full pipeline: build web assets, Capacitor sync, archive, sign, export IPA,
# upload to TestFlight, and create a GitHub Release.
#
# -------------------------------------------------------------------------
# REQUIRED SECRETS (configure in GitHub repo Settings > Secrets):
# -------------------------------------------------------------------------
#
# Code Signing:
#   APPLE_CERTIFICATE_BASE64          - Base64-encoded .p12 distribution certificate
#                                       Generate: base64 -i Certificates.p12 | pbcopy
#   APPLE_CERTIFICATE_PASSWORD        - Password for the .p12 certificate
#   APPLE_PROVISIONING_PROFILE_BASE64 - Base64-encoded .mobileprovision file
#                                       Generate: base64 -i profile.mobileprovision | pbcopy
#
# App Store Connect API (for upload + automatic signing):
#   APP_STORE_CONNECT_API_KEY_ID      - Key ID from App Store Connect > Keys
#   APP_STORE_CONNECT_ISSUER_ID   - Issuer ID from App Store Connect > Keys
#   APP_STORE_CONNECT_API_KEY_BASE64  - Base64-encoded .p8 private key file
#                                       Generate: base64 -i AuthKey_XXXXXXXX.p8 | pbcopy
#
# Optional (Fastlane match alternative):
#   MATCH_PASSWORD                    - Passphrase for Fastlane match encryption
#   MATCH_GIT_URL                     - Git repo URL for match certificate storage
#
# Optional (notifications):
#   SLACK_WEBHOOK_URL                 - Slack incoming webhook for deploy notifications
# -------------------------------------------------------------------------

name: Deploy to TestFlight

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'testflight'
        type: choice
        options:
          - testflight
          - appstore
      release_notes:
        description: 'TestFlight release notes (shown to testers)'
        required: false
        default: 'Bug fixes and improvements.'
        type: string

concurrency:
  group: testflight-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  DEVELOPMENT_TEAM: 'V5ZA5FZ2J8'
  BUNDLE_ID: 'com.perenniaai.crm'
  SCHEME: 'App'

jobs:
  deploy:
    name: Build & Deploy to TestFlight
    runs-on: macos-14
    timeout-minutes: 90
    environment: production

    steps:
      # ---------------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------------
      # Tool setup
      # ---------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Ruby (for Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install Fastlane
        run: gem install fastlane

      - name: Select Xcode version
        run: |
          ls /Applications/ | grep Xcode | sort -V
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          echo "Selected Xcode:"
          xcodebuild -version

      # ---------------------------------------------------------------
      # Cache: SPM packages
      # ---------------------------------------------------------------
      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            frontend/ios/App/DerivedData/SourcePackages
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('frontend/ios/App/CapApp-SPM/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # ---------------------------------------------------------------
      # Extract version info
      # ---------------------------------------------------------------
      - name: Extract version
        id: version
        working-directory: frontend
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          BUILD_NUMBER=${{ github.run_number }}

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (Build $BUILD_NUMBER)"

      # ---------------------------------------------------------------
      # Install frontend dependencies
      # ---------------------------------------------------------------
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # ---------------------------------------------------------------
      # Build production web assets
      # ---------------------------------------------------------------
      - name: Build web assets
        working-directory: frontend
        run: |
          # Swap in production capacitor config if available
          if [ -f "capacitor.config.production.ts" ]; then
            cp capacitor.config.ts capacitor.config.dev.bak
            cp capacitor.config.production.ts capacitor.config.ts
          fi
          npm run build
        env:
          CI: false
          REACT_APP_API_URL: https://api.perenniaai.com
          REACT_APP_ENVIRONMENT: production

      # ---------------------------------------------------------------
      # Capacitor sync
      # ---------------------------------------------------------------
      - name: Sync Capacitor
        working-directory: frontend
        run: |
          # Restore dev config if we swapped it
          if [ -f "capacitor.config.dev.bak" ]; then
            mv capacitor.config.dev.bak capacitor.config.ts
          fi
          rm -f ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          npx cap sync ios

      # ---------------------------------------------------------------
      # Code signing: install certificate and provisioning profile
      # ---------------------------------------------------------------
      - name: Install Apple certificate and provisioning profile
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          security import "$CERT_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Install provisioning profile
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          cp "$PROFILE_PATH" "$PROFILES_DIR/"

          echo "Certificate and provisioning profile installed."
          echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------
      # Setup App Store Connect API key
      # ---------------------------------------------------------------
      - name: Setup App Store Connect API Key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8
          echo "API key installed at ~/.appstoreconnect/private_keys/"

      # ---------------------------------------------------------------
      # Increment build number
      # ---------------------------------------------------------------
      - name: Increment build number
        working-directory: frontend/ios/App
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="${{ steps.version.outputs.build_number }}"

          # Update Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" App/Info.plist 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" App/Info.plist 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD" App/Info.plist

          # Update project.pbxproj
          sed -i '' "s/MARKETING_VERSION = [^;]*/MARKETING_VERSION = $VERSION/" App.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*/CURRENT_PROJECT_VERSION = $BUILD/" App.xcodeproj/project.pbxproj

          echo "Version set to $VERSION ($BUILD)"

      # ---------------------------------------------------------------
      # Production entitlements
      # ---------------------------------------------------------------
      - name: Configure production entitlements
        working-directory: frontend/ios/App
        run: |
          if [ -f "App/App.entitlements.release" ]; then
            cp App/App.entitlements.release App/App.entitlements
            echo "Production entitlements applied."
          else
            echo "No release entitlements file found — using existing entitlements."
          fi

      # ---------------------------------------------------------------
      # Build and archive
      # ---------------------------------------------------------------
      - name: Build and archive
        working-directory: frontend/ios/App
        run: |
          set -euo pipefail

          ARCHIVE_PATH="${{ runner.temp }}/PerenniaAI.xcarchive"
          API_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8"

          xcodebuild clean archive \
            -project App.xcodeproj \
            -scheme "${{ env.SCHEME }}" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="${{ env.DEVELOPMENT_TEAM }}" \
            PRODUCT_BUNDLE_IDENTIFIER="${{ env.BUNDLE_ID }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            2>&1 | tee "${{ runner.temp }}/xcodebuild-archive.log"

          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "Archive not found at $ARCHIVE_PATH"
            exit 1
          fi

          ARCHIVE_SIZE=$(du -sh "$ARCHIVE_PATH" | cut -f1)
          echo "Archive created: $ARCHIVE_SIZE"
          echo "archive_path=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------
      # Export IPA
      # ---------------------------------------------------------------
      - name: Export IPA
        working-directory: frontend
        run: |
          set -euo pipefail

          IPA_DIR="${{ runner.temp }}/ipa"
          mkdir -p "$IPA_DIR"
          API_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8"

          xcodebuild -exportArchive \
            -archivePath "${{ env.archive_path }}" \
            -exportOptionsPlist ios/ExportOptions-appstore.plist \
            -exportPath "$IPA_DIR" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            2>&1 | tee "${{ runner.temp }}/xcodebuild-export.log"

          # Verify IPA was created
          IPA_FILE=$(find "$IPA_DIR" -name "*.ipa" -print -quit)
          if [ -z "$IPA_FILE" ]; then
            echo "No IPA found in $IPA_DIR!"
            ls -laR "$IPA_DIR"
            exit 1
          fi

          IPA_SIZE=$(du -sh "$IPA_FILE" | cut -f1)
          echo "IPA exported: $IPA_FILE ($IPA_SIZE)"
          echo "ipa_dir=$IPA_DIR" >> "$GITHUB_ENV"
          echo "ipa_file=$IPA_FILE" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------
      # Generate Software Bill of Materials
      # ---------------------------------------------------------------
      - name: Generate Software Bill of Materials
        run: |
          # Generate SBOM from SPM dependencies
          echo '{"bomFormat":"CycloneDX","specVersion":"1.4","components":[' > sbom.json

          # Extract SPM dependencies
          cd frontend/ios/App/CapApp-SPM
          swift package show-dependencies --format json 2>/dev/null | python3 -c "
          import json, sys
          try:
              deps = json.load(sys.stdin)
              components = []
              def walk(node):
                  if 'name' in node:
                      components.append({
                          'type': 'library',
                          'name': node.get('name', ''),
                          'version': node.get('version', 'unknown'),
                          'purl': f\"pkg:swift/{node.get('name', '')}@{node.get('version', 'unknown')}\"
                      })
                  for dep in node.get('dependencies', []):
                      walk(dep)
              walk(deps)
              print(json.dumps(components))
          except:
              print('[]')
          " >> ../../../sbom-components.json 2>/dev/null || echo '[]' > ../../../sbom-components.json
          cd ../../../

          # Also include npm dependencies
          cd frontend
          npm ls --json --all 2>/dev/null | python3 -c "
          import json, sys
          try:
              data = json.load(sys.stdin)
              deps = data.get('dependencies', {})
              components = []
              for name, info in deps.items():
                  components.append({
                      'type': 'library',
                      'name': name,
                      'version': info.get('version', 'unknown'),
                      'purl': f'pkg:npm/{name}@{info.get(\"version\", \"unknown\")}'
                  })
              print(json.dumps(components))
          except:
              print('[]')
          " > ../sbom-npm.json 2>/dev/null || echo '[]' > ../sbom-npm.json
          cd ..

          echo "SBOM generated with $(cat sbom-components.json 2>/dev/null | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' 2>/dev/null || echo 0) Swift + $(cat sbom-npm.json 2>/dev/null | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' 2>/dev/null || echo 0) npm components"
        continue-on-error: true

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom-components.json
            sbom-npm.json
          retention-days: 90
        if: always()
        continue-on-error: true

      # ---------------------------------------------------------------
      # Build attestation
      # ---------------------------------------------------------------
      - name: Generate build attestation
        run: |
          # Create attestation record
          IPA_PATH=$(find . -name "*.ipa" -print -quit)
          if [ -n "$IPA_PATH" ]; then
            shasum -a 256 "$IPA_PATH" > build-attestation.sha256
            echo "Build SHA-256: $(cat build-attestation.sha256)"
            echo "Build Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> build-attestation.sha256
            echo "Runner: $RUNNER_NAME" >> build-attestation.sha256
            echo "Commit: $GITHUB_SHA" >> build-attestation.sha256
          fi
        continue-on-error: true

      # ---------------------------------------------------------------
      # Upload to TestFlight
      # ---------------------------------------------------------------
      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail

          echo "Uploading ${{ env.ipa_file }} to TestFlight..."

          # Create Fastlane API key JSON (replaces deprecated xcrun altool)
          API_KEY_JSON="${{ runner.temp }}/fastlane_api_key.json"
          cat > "$API_KEY_JSON" <<KEYEOF
          {
            "key_id": "$APP_STORE_CONNECT_API_KEY_ID",
            "issuer_id": "$APP_STORE_CONNECT_ISSUER_ID",
            "key_filepath": "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8",
            "in_house": false
          }
          KEYEOF

          fastlane pilot upload \
            --ipa "${{ env.ipa_file }}" \
            --api_key_path "$API_KEY_JSON" \
            --skip_waiting_for_build_processing

          rm -f "$API_KEY_JSON"
          echo "Upload complete. Check App Store Connect for processing status."

      # ---------------------------------------------------------------
      # Upload artifacts
      # ---------------------------------------------------------------
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PerenniaAI-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_number }}
          path: |
            ${{ env.ipa_dir }}/*.ipa
          retention-days: 30

      - name: Upload dSYM artifact
        uses: actions/upload-artifact@v4
        with:
          name: PerenniaAI-dSYM-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_number }}
          path: ${{ env.archive_path }}/dSYMs
          retention-days: 90
          if-no-files-found: warn

      # ---------------------------------------------------------------
      # Create GitHub Release (only on version tags)
      # ---------------------------------------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ipa_dir }}/*.ipa
          generate_release_notes: true
          body: |
            ## Perennia AI iOS ${{ steps.version.outputs.version }} (Build ${{ steps.version.outputs.build_number }})

            Uploaded to TestFlight. Check [App Store Connect](https://appstoreconnect.apple.com) for processing status.

            ### What's Changed
            See auto-generated notes below.

      # ---------------------------------------------------------------
      # Slack notification (optional — only if webhook is configured)
      # ---------------------------------------------------------------
      - name: Notify Slack
        if: always() && secrets.SLACK_WEBHOOK_URL != ''
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATUS_EMOJI="white_check_mark"
            STATUS_TEXT="deployed to TestFlight"
          else
            STATUS_EMOJI="x"
            STATUS_TEXT="FAILED"
          fi

          curl -sS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d "{
              \"text\": \":${STATUS_EMOJI}: iOS v${{ steps.version.outputs.version }} (build ${{ steps.version.outputs.build_number }}) ${STATUS_TEXT}\",
              \"blocks\": [
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \":${STATUS_EMOJI}: *Perennia AI iOS* v${{ steps.version.outputs.version }} (build ${{ steps.version.outputs.build_number }}) ${STATUS_TEXT}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>\"
                  }
                }
              ]
            }"

      # ---------------------------------------------------------------
      # Build summary
      # ---------------------------------------------------------------
      - name: Build summary
        if: always()
        run: |
          echo "### TestFlight Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Version** | ${{ steps.version.outputs.version }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Build** | ${{ steps.version.outputs.build_number }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Status** | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Bundle ID** | ${{ env.BUNDLE_ID }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Team** | ${{ env.DEVELOPMENT_TEAM }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Xcode** | $(xcodebuild -version 2>/dev/null | head -1 || echo 'N/A') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Trigger** | ${{ github.event_name }} |" >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------
      # Cleanup: remove keychain and signing materials
      # ---------------------------------------------------------------
      - name: Cleanup signing
        if: always()
        run: |
          security delete-keychain "${{ env.keychain_path }}" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12"
          rm -f "$RUNNER_TEMP/profile.mobileprovision"
          rm -rf ~/.appstoreconnect/private_keys
