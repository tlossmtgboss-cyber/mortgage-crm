name: Update Overview Stats

on:
  push:
    branches: [main]
    paths-ignore:
      - 'overview/data/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Skip if bot commit
        run: |
          if echo "${{ github.event.head_commit.message }}" | grep -q '^\[overview-bot\]'; then
            echo "Bot commit detected, skipping."
            exit 0
          fi

      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute stats
        run: |
          chmod +x overview/scripts/compute-stats.sh
          bash overview/scripts/compute-stats.sh

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet overview/data/stats.json && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "overview-bot"
          git config user.email "overview-bot@users.noreply.github.com"
          git add overview/data/stats.json
          git commit -m "[overview-bot] Update stats"
          git push
