# ci/secrets-scan.yml
# Drop-in: .github/workflows/secrets-scan.yml
#
# Fails the PR if any secret pattern is introduced. Complements the pre-commit
# hook in step 01 — pre-commit can be bypassed with --no-verify, this cannot.

name: Secrets Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history — gitleaks scans all commits in the PR diff
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # NOTE: detect-secrets job removed — .secrets.baseline file does not exist.
  # Gitleaks (above) and security-scan.yml provide sufficient secret detection.
  # To re-enable: run `detect-secrets scan > .secrets.baseline` and uncomment.

  env-file-guard:
    name: Reject committed .env files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block .env.* commits
        run: |
          # Any file matching .env or .env.* fails the build,
          # EXCEPT files ending in .example (e.g. .env.example, .env.multi-tenant.example)
          offenders=$(find . -type f \( -name ".env" -o -name ".env.*" \) \
            ! -name "*.example" ! -path "./node_modules/*" ! -path "./.git/*" || true)
          if [ -n "$offenders" ]; then
            echo "!! Committed .env files detected:"
            echo "$offenders"
            echo ""
            echo "Only .env*.example files are allowed. Move secrets to Railway env vars."
            exit 1
          fi
