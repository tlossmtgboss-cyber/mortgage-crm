name: Agent Challenge Nightly

# Nightly regression check for Perennia AI's 20-agent fleet.
# Runs the full u_agent_challenge suite against the configured Perennia
# API and compares the result against backend/agents/challenge/baseline.json.
# A regression (overall drop > 2pt, any pillar drop > 5pt, or a new
# critical-severity failure) fails the job.

on:
  schedule:
    # 08:00 UTC = 04:00 ET — runs daily after the midnight cron has
    # generated workflow tasks for the day.
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  challenge:
    name: Run nightly agent challenge
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run agent challenge suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERENNIA_API_URL: ${{ secrets.PERENNIA_API_URL }}
          PERENNIA_API_USER: ${{ secrets.PERENNIA_API_USER }}
          PERENNIA_API_PASS: ${{ secrets.PERENNIA_API_PASS }}
        run: |
          python3 -m backend.agents.challenge.runner \
            --output json \
            --baseline backend/agents/challenge/baseline.json \
            --write challenge-report.json

      - name: Upload challenge report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-challenge-report
          path: challenge-report.json
          retention-days: 30
