# ci/e2e.yml
# Drop-in: .github/workflows/e2e.yml

name: E2E (Playwright)

on:
  pull_request:
    branches: [main, develop]
  schedule:
    # Nightly smoke against main, independent of PRs
    - cron: "0 7 * * *"

jobs:
  e2e:
    name: Playwright critical paths
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: perennia_e2e
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/perennia_e2e
      DATABASE_MIGRATE_URL: postgresql+asyncpg://test:test@localhost:5432/perennia_e2e
      REDIS_URL: redis://localhost:6379/0
      ENV: test
      PII_ENCRYPTION_KEY: ${{ secrets.TEST_PII_ENCRYPTION_KEY }}
      JWT_PRIVATE_KEY: ${{ secrets.TEST_JWT_PRIVATE_KEY }}
      JWT_PUBLIC_KEY: ${{ secrets.TEST_JWT_PUBLIC_KEY }}
      ANTHROPIC_API_KEY: sk-test-fake
      COOKIE_DOMAIN: ""
      VITE_API_URL: http://localhost:8000/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }

      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }

      - name: Install backend
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Install frontend
        run: |
          cd frontend
          npm ci

      - name: Enable pgcrypto and run migrations
        run: |
          psql "postgresql://test:test@localhost:5432/perennia_e2e" -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          cd backend && alembic upgrade head

      - name: Seed test data
        run: cd backend && python -m scripts.seed_e2e

      - name: Start backend
        run: |
          cd backend
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          echo $! > /tmp/backend.pid
          # Wait for readiness
          for i in {1..30}; do
            if curl -sf http://localhost:8000/ready; then break; fi
            sleep 1
          done

      - name: Build and serve frontend
        run: |
          cd frontend
          npm run build
          npx serve -s dist -l 5173 &
          echo $! > /tmp/frontend.pid
          for i in {1..20}; do
            if curl -sf http://localhost:5173/; then break; fi
            sleep 1
          done

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run Playwright
        run: cd frontend && npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Stop services
        if: always()
        run: |
          kill $(cat /tmp/backend.pid) 2>/dev/null || true
          kill $(cat /tmp/frontend.pid) 2>/dev/null || true
