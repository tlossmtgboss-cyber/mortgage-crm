# E2E tests with Playwright against a local backend+frontend stack.
# Runs on PRs to main and nightly.

name: E2E (Playwright)

on:
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  e2e:
    name: Playwright critical paths
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: perennia_e2e
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    env:
      DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/perennia_e2e
      REDIS_URL: redis://localhost:6379/0
      ENV: test
      PII_ENCRYPTION_KEY: ${{ secrets.TEST_PII_ENCRYPTION_KEY }}
      JWT_PRIVATE_KEY: ${{ secrets.TEST_JWT_PRIVATE_KEY }}
      JWT_PUBLIC_KEY: ${{ secrets.TEST_JWT_PUBLIC_KEY }}
      ANTHROPIC_API_KEY: sk-test-fake
      COOKIE_DOMAIN: ""
      VITE_API_URL: http://localhost:8000/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Install frontend
        run: |
          cd frontend
          npm ci

      - name: Enable pgcrypto
        run: |
          psql "postgresql://test:test@localhost:5432/perennia_e2e" -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Start backend
        run: |
          cd backend
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          echo $! > /tmp/backend.pid
          # Wait for health endpoint
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health/live; then break; fi
            sleep 1
          done

      - name: Build and serve frontend
        run: |
          cd frontend
          npm run build
          npx serve -s build -l 5173 &
          echo $! > /tmp/frontend.pid
          for i in $(seq 1 20); do
            if curl -sf http://localhost:5173/; then break; fi
            sleep 1
          done

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run Playwright
        run: cd frontend && npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Stop services
        if: always()
        run: |
          kill $(cat /tmp/backend.pid) 2>/dev/null || true
          kill $(cat /tmp/frontend.pid) 2>/dev/null || true
