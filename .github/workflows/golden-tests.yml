# .github/workflows/golden-tests.yml
#
# Golden test gate for Perennia AI backend.
#
# These tests are the "thin red line": auth, lead CRUD, loan state transitions,
# portal login, and pipeline load. If any of these fail, no PR may merge.
#
# The existing test.yml has a `golden-flow-tests` job that selects by pytest
# marker (`-m "golden or critical"`). This workflow is intentionally distinct:
# it selects by file glob (`test_golden_*.py`) and pins dependencies from
# requirements.lock so the golden suite is reproducible bit-for-bit.

name: Golden Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: golden-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-tests:
    name: Golden tests (file-pattern, locked deps)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_perennia
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config

      - name: Install pinned dependencies from requirements.lock
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          # Ensure pytest tooling is present even if not in the lock
          pip install pytest pytest-asyncio pytest-timeout httpx

      - name: Discover golden tests
        working-directory: ./backend
        run: |
          python -m pytest tests/test_golden_*.py tests/integration/ --collect-only -q

      - name: Run golden + integration tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_perennia
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test_perennia
          TESTING: "1"
          SECRET_KEY: ci-test-secret-key
          DATA_ENCRYPTION_KEY: ci-test-encryption-key-32-bytes-min
          # ----------------------------------------------------------------
          # Portal test credentials (see docs/portal_test_credentials_setup.md)
          # These resolve to empty strings until the repo owner provisions the
          # matching GitHub Actions secrets — the test harness will then skip
          # individual tests with a clear message rather than fail.
          # ----------------------------------------------------------------
          PERENNIA_TEST_API_BASE_URL: ${{ secrets.PERENNIA_TEST_API_BASE_URL }}
          PERENNIA_TEST_PURL_TOKEN: ${{ secrets.PERENNIA_TEST_PURL_TOKEN }}
          PERENNIA_TEST_PURL_TOKEN_TENANT_A: ${{ secrets.PERENNIA_TEST_PURL_TOKEN_TENANT_A }}
          PERENNIA_TEST_PURL_TOKEN_TENANT_B: ${{ secrets.PERENNIA_TEST_PURL_TOKEN_TENANT_B }}
          PERENNIA_TEST_ADMIN_JWT: ${{ secrets.PERENNIA_TEST_ADMIN_JWT }}
          PERENNIA_TEST_WORKSPACE_ID: ${{ secrets.PERENNIA_TEST_WORKSPACE_ID }}
          PERENNIA_TEST_BORROWER_READ_TOKEN: ${{ secrets.PERENNIA_TEST_BORROWER_READ_TOKEN }}
          PERENNIA_TEST_EXPIRED_TOKEN: ${{ secrets.PERENNIA_TEST_EXPIRED_TOKEN }}
          PERENNIA_TEST_TENANT_B_LOAN_ID: ${{ secrets.PERENNIA_TEST_TENANT_B_LOAN_ID }}
        run: |
          python -m pytest tests/test_golden_*.py tests/integration/ -v --maxfail=5
