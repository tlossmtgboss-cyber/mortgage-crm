# .github/workflows/test.yml
# Production-Grade Testing & Reliability Pipeline
name: Test Suite
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'
jobs:
  # ============================================================================
  # STAGE 1: CRITICAL TESTS (Blocking)
  # ============================================================================
  unit-tests:
    name: Unit Tests (Critical)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_perennia
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx pytest-timeout
      - name: Run unit tests
        working-directory: ./backend
        env:
          TESTING: 'true'
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test_perennia
          DATABASE_URL: postgresql://test:test@localhost:5432/test_perennia
          SECRET_KEY: ci-test-secret-key
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
        run: |
          pytest tests/ -v -m "unit" --timeout=30 --tb=short --continue-on-collection-errors \
            --cov=. --cov-report=xml --cov-fail-under=70
  contract-tests:
    name: API Contract Tests (Critical)
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx pytest-timeout
      - name: Run contract tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          TESTING: 'true'
        run: |
          pytest tests/ -v -m "contract" --timeout=60 --tb=short
  golden-flow-tests:
    name: Golden Flow Tests (Critical)
    runs-on: ubuntu-latest
    needs: contract-tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx pytest-timeout
      - name: Run golden flow tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SECRET_KEY: ci-test-secret-key
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          TESTING: 'true'
        run: |
          pytest tests/ -v -m "golden or critical" --timeout=120 --tb=short --continue-on-collection-errors
  # ============================================================================
  # STAGE 2: INTEGRATION & AI TESTS (Blocking)
  # ============================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: golden-flow-tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx pytest-timeout
      - name: Run integration tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          TESTING: 'true'
        run: |
          pytest tests/ -v -m "integration" --timeout=180 --tb=short
  ai-harness-tests:
    name: AI Harness Tests
    runs-on: ubuntu-latest
    needs: golden-flow-tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_perennia
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx pytest-timeout
      - name: Run AI harness tests
        working-directory: ./backend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TESTING: 'true'
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test_perennia
          DATABASE_URL: postgresql://test:test@localhost:5432/test_perennia
        run: |
          pytest tests/ -v -m "ai or agents" --timeout=120 --tb=short
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm install
      - name: Run frontend tests
        working-directory: ./frontend
        run: npx vitest run --passWithNoTests
      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json
      - name: Install Python linters
        run: pip install flake8 black isort
      - name: Install Node dependencies
        working-directory: ./frontend
        run: npm install
      - name: Run Python linting
        working-directory: ./backend
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint --if-present
  # NOTE: Comprehensive security scanning (gitleaks, semgrep, codeql, trivy) is
  # handled by the dedicated security-scan.yml workflow. The dependency-audit and
  # secret-scan jobs below provide fast, blocking checks on every PR.
  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy types-redis types-requests
      - name: Run mypy
        working-directory: ./backend
        run: |
          mypy --ignore-missing-imports --no-strict-optional --warn-return-any auth/ db.py middleware/rate_limiting.py middleware/csrf_protection.py
  # ============================================================================
  # STAGE 3: CODE QUALITY (Blocking)
  # ============================================================================
  file-size-check:
    name: File Size Limits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check file sizes
        run: bash scripts/check-file-sizes.sh
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit Python dependencies
        working-directory: ./backend
        run: pip-audit --requirement requirements.txt --vulnerability-service osv --strict
      - name: Install Node dependencies
        working-directory: ./frontend
        run: npm ci --prefer-offline
      - name: Audit Node dependencies
        working-directory: ./frontend
        run: npm audit --audit-level=high
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan git history for hardcoded secrets
        run: |
          echo "Scanning for hardcoded secrets in git history..."
          FOUND=$(git log --all -p | grep -cE '(AKIA[0-9A-Z]{16}|sk-[a-zA-Z0-9]{20,}|-----BEGIN (RSA |EC )?PRIVATE KEY)' || true)
          if [ "$FOUND" -gt 0 ]; then
            echo "::error::Found $FOUND potential secret(s) in git history!"
            echo "Matches:"
            git log --all -p | grep -nE '(AKIA[0-9A-Z]{16}|sk-[a-zA-Z0-9]{20,}|-----BEGIN (RSA |EC )?PRIVATE KEY)' | head -20
            exit 1
          fi
          echo "No hardcoded secrets found in git history."
      - name: Check for committed .env files
        run: |
          echo "Checking for committed .env files..."
          ENV_FILES=$(git ls-files | grep -E '(^|/)\.env($|\.[^e])' | grep -v '\.example' || true)
          if [ -n "$ENV_FILES" ]; then
            echo "::error::Found committed .env files that should not be in the repository:"
            echo "$ENV_FILES"
            exit 1
          fi
          echo "No .env files found in repository."
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [golden-flow-tests, frontend-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm install
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          CI: true
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ./frontend/build
          retention-days: 7
  # ============================================================================
  # FINAL GATE: All stages must pass for the pipeline to succeed
  # ============================================================================
  pipeline-status:
    name: Pipeline Status
    if: always()
    runs-on: ubuntu-latest
    needs:
      # Stage 1
      - unit-tests
      - contract-tests
      - golden-flow-tests
      # Stage 2
      - integration-tests
      - ai-harness-tests
      - frontend-tests
      # Stage 3
      - lint
      - type-check
      - file-size-check
      - dependency-audit
      - secret-scan
      - build-check
    steps:
      - name: Check pipeline result
        run: |
          echo "Job results:"
          echo "  unit-tests:        ${{ needs.unit-tests.result }}"
          echo "  contract-tests:    ${{ needs.contract-tests.result }}"
          echo "  golden-flow-tests: ${{ needs.golden-flow-tests.result }}"
          echo "  integration-tests: ${{ needs.integration-tests.result }}"
          echo "  ai-harness-tests:  ${{ needs.ai-harness-tests.result }}"
          echo "  frontend-tests:    ${{ needs.frontend-tests.result }}"
          echo "  lint:              ${{ needs.lint.result }}"
          echo "  type-check:        ${{ needs.type-check.result }}"
          echo "  file-size-check:   ${{ needs.file-size-check.result }}"
          echo "  dependency-audit:  ${{ needs.dependency-audit.result }}"
          echo "  secret-scan:       ${{ needs.secret-scan.result }}"
          echo "  build-check:       ${{ needs.build-check.result }}"
          if [[ "${{ needs.unit-tests.result }}" != "success" || \
                "${{ needs.contract-tests.result }}" != "success" || \
                "${{ needs.golden-flow-tests.result }}" != "success" || \
                "${{ needs.integration-tests.result }}" != "success" || \
                "${{ needs.ai-harness-tests.result }}" != "success" || \
                "${{ needs.frontend-tests.result }}" != "success" || \
                "${{ needs.lint.result }}" != "success" || \
                "${{ needs.type-check.result }}" != "success" || \
                "${{ needs.file-size-check.result }}" != "success" || \
                "${{ needs.dependency-audit.result }}" != "success" || \
                "${{ needs.secret-scan.result }}" != "success" || \
                "${{ needs.build-check.result }}" != "success" ]]; then
            echo "::error::One or more pipeline jobs failed or were skipped."
            exit 1
          fi
          echo "All pipeline jobs passed."
