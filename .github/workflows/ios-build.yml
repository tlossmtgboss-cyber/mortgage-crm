name: iOS Build and Deploy

on:
  # Tag trigger disabled — this workflow targets macos-26/Xcode 26 (not yet available).
  # Use mobile-testflight.yml for current builds. Re-enable when macos-26 runners ship.
  # push:
  #   tags:
  #     - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'testflight'
        type: choice
        options:
          - testflight
          - appstore
      skip_upload:
        description: 'Skip TestFlight upload'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '24'

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-26  # macOS Tahoe with Xcode 26 (required by Capacitor 8)
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Select Xcode version
        run: |
          # List available Xcode versions
          ls /Applications/ | grep Xcode | sort -V
          # Use Xcode 26 (required by Capacitor 8 SPM)
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer \
            || sudo xcode-select -s /Applications/Xcode_26.1.app/Contents/Developer \
            || sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer \
            || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iOS || true

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Extract version from tag or package.json
        id: version
        working-directory: frontend
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          BUILD_NUMBER=${{ github.run_number }}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Version: $VERSION, Build: $BUILD_NUMBER"

      - name: Setup App Store Connect API Key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

      - name: Build production web assets
        working-directory: frontend
        run: |
          npm run build
        env:
          CI: false  # Allows build warnings
          REACT_APP_API_URL: https://api.perenniaai.com
          REACT_APP_ENVIRONMENT: production

      - name: Sync Capacitor
        working-directory: frontend
        run: |
          # Remove stale Package.resolved so Xcode resolves fresh SPM deps
          rm -f ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          npx cap sync ios

      - name: Update version numbers
        working-directory: frontend/ios/App
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="${{ steps.version.outputs.build_number }}"

          # Update Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" App/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" App/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD" App/Info.plist

          # Update pbxproj
          sed -i '' "s/MARKETING_VERSION = [^;]*/MARKETING_VERSION = $VERSION/" App.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*/CURRENT_PROJECT_VERSION = $BUILD/" App.xcodeproj/project.pbxproj

      - name: Configure production entitlements
        working-directory: frontend/ios/App
        run: |
          if [ -f "App/App.entitlements.release" ]; then
            cp App/App.entitlements.release App/App.entitlements
          fi

      - name: Build and Archive
        working-directory: frontend/ios/App
        run: |
          xcodebuild clean archive \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ${{ runner.temp }}/PerenniaAI.xcarchive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=V5ZA5FZ2J8 \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - name: Export IPA
        working-directory: frontend
        run: |
          xcodebuild -exportArchive \
            -archivePath ${{ runner.temp }}/PerenniaAI.xcarchive \
            -exportOptionsPlist ios/ExportOptions-appstore.plist \
            -exportPath ${{ runner.temp }}/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - name: List export output
        run: |
          echo "=== Export directory contents ==="
          ls -laR ${{ runner.temp }}/ipa/ || echo "ipa dir not found"
          echo "=== Archive contents ==="
          ls ${{ runner.temp }}/PerenniaAI.xcarchive/Products/ || echo "Products dir not found"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PerenniaAI-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_number }}
          path: |
            ${{ runner.temp }}/ipa/*.ipa
            ${{ runner.temp }}/ipa/**/*.ipa
          retention-days: 30
          if-no-files-found: warn

      - name: Upload dSYM artifact
        uses: actions/upload-artifact@v4
        with:
          name: PerenniaAI-dSYM-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_number }}
          path: ${{ runner.temp }}/PerenniaAI.xcarchive/dSYMs
          retention-days: 90

      - name: Upload to TestFlight
        if: ${{ github.event.inputs.skip_upload != 'true' }}
        run: |
          IPA_FILE=$(find ${{ runner.temp }}/ipa -name "*.ipa" -print -quit 2>/dev/null)
          if [ -z "$IPA_FILE" ]; then
            echo "No IPA in export dir, searching runner temp..."
            IPA_FILE=$(find ${{ runner.temp }} -name "*.ipa" -print -quit 2>/dev/null)
          fi
          if [ -n "$IPA_FILE" ]; then
            echo "Uploading $IPA_FILE to App Store Connect..."

            # Create Fastlane API key JSON (replaces deprecated xcrun altool)
            API_KEY_JSON="${{ runner.temp }}/fastlane_api_key.json"
            cat > "$API_KEY_JSON" <<KEYEOF
            {
              "key_id": "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}",
              "issuer_id": "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}",
              "key_filepath": "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8",
              "in_house": false
            }
          KEYEOF

            gem install fastlane 2>/dev/null || true
            fastlane pilot upload \
              --ipa "$IPA_FILE" \
              --api_key_path "$API_KEY_JSON" \
              --skip_waiting_for_build_processing

            rm -f "$API_KEY_JSON"
          else
            echo "No IPA file found. Check if export step succeeded."
            exit 1
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ runner.temp }}/ipa/*.ipa
          fail_on_unmatched_files: false
          body: |
            ## iOS Build ${{ steps.version.outputs.version }} (${{ steps.version.outputs.build_number }})

            - Uploaded to TestFlight
            - Check App Store Connect for processing status

            ### Changes
            See commit history for details.
